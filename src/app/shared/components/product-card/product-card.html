<article class="card">
  <a class="card__link" [routerLink]="['/products', product().slug]">
    <span class="visually-hidden">View {{ product().name }}</span>
  </a>

  <div class="card__media">
    <app-product-image [product]="product()" [priority]="priority()" [width]="640" [height]="480" />
    <span class="card__category">{{ product().categoryName }}</span>
    <span class="card__view" aria-hidden="true">
      View details <i class="fa-solid fa-arrow-right"></i>
    </span>
  </div>

  <div class="card__body">
    @if (headingLevel() === 2) {
      <h2 class="card__name">{{ product().name }}</h2>
    } @else {
      <h3 class="card__name">{{ product().name }}</h3>
    }
    <p class="card__desc">{{ product().shortDescription }}</p>

    @if (keySpec(); as spec) {
      <p class="card__spec">
        <span>{{ spec.label }}</span>
        <strong>{{ spec.value }}</strong>
      </p>
    }

    <div class="card__actions">
      <a class="card__btn card__btn--wa"
         [href]="whatsappHref()" target="_blank" rel="noopener"
         [attr.aria-label]="'Enquire about ' + product().name + ' on WhatsApp'">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
        <span>WhatsApp</span>
      </a>
      <a class="card__btn card__btn--mail"
         [href]="emailHref()"
         [attr.aria-label]="'Email an enquiry about ' + product().name">
        <i class="fa-regular fa-envelope" aria-hidden="true"></i>
        <span>Email</span>
      </a>
    </div>
  </div>
</article>
